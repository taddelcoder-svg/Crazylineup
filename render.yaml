# Render-Blueprint: Web Service mit kleinem Node-Server (keine Abhängigkeiten, kein Build).
# Alternativ läuft es als Docker-Dienst (Dockerfile, nginx).
services:
  - type: web
    name: crazylineups
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
